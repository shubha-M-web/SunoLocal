{% extends "base.html" %}

{% block title %}Edit Opportunity #{{ opp.id }} - SunoLocal Admin{% endblock %}

{% block content %}
<div class="container py-4">
  
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="fw-bold mb-1">Edit Opportunity #{{ opp.id }}</h2>
      <p class="text-muted small mb-0">Modify fields, update source URLs, or adjust deadlines.</p>
    </div>
    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
      &larr; Back to Admin Dashboard
    </a>
  </div>

  <div class="card card-sunolocal p-4 p-md-5 bg-white border-0 shadow">
    <form action="{{ url_for('admin_edit', id=opp.id) }}" method="POST">
      
      <div class="row g-3 mb-3">
        <div class="col-md-8">
          <label class="form-label fw-bold small">Opportunity Title (English) *</label>
          <input type="text" name="title" class="form-control" value="{{ opp.title }}" required>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-bold small">Category *</label>
          <select name="category" class="form-select" required>
            {% for cat in available_interests %}
              <option value="{{ cat }}" {% if opp.category == cat %}selected{% endif %}>{{ cat }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label fw-bold small">Kannada Title</label>
          <input type="text" name="kannada_title" class="form-control" value="{{ opp.kannada_title or '' }}">
        </div>
        <div class="col-md-3">
          <label class="form-label fw-bold small">Location *</label>
          <select name="location" class="form-select" required>
            {% for loc in available_locations %}
              <option value="{{ loc }}" {% if opp.location == loc %}selected{% endif %}>{{ loc }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label fw-bold small">Publishing Organization *</label>
          <input type="text" name="organization" class="form-control" value="{{ opp.organization }}" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold small">Short Description *</label>
        <textarea name="short_description" class="form-control" rows="2" required>{{ opp.short_description }}</textarea>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold small">Full Description / Notification Content</label>
        <textarea name="full_description" class="form-control" rows="4">{{ opp.full_description }}</textarea>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold small">Kannada Description</label>
        <textarea name="kannada_description" class="form-control" rows="2">{{ opp.kannada_description or '' }}</textarea>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label fw-bold small">Eligibility Criteria</label>
          <input type="text" name="eligibility" class="form-control" value="{{ opp.eligibility or '' }}">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-bold small">Required Documents / Requirements</label>
          <input type="text" name="requirements" class="form-control" value="{{ opp.requirements or '' }}">
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <label class="form-label fw-bold small">Application Deadline (YYYY-MM-DD)</label>
          <input type="date" name="deadline" class="form-control" value="{{ opp.deadline or '' }}">
        </div>
        <div class="col-md-4">
          <label class="form-label fw-bold small">Publication Date (YYYY-MM-DD)</label>
          <input type="date" name="publication_date" class="form-control" value="{{ opp.publication_date or '' }}">
        </div>
        <div class="col-md-4">
          <label class="form-label fw-bold small">Publisher Source Name</label>
          <input type="text" name="source_name" class="form-control" value="{{ opp.source_name or '' }}">
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-8">
          <label class="form-label fw-bold small">Original Source URL</label>
          <input type="url" name="source_url" class="form-control" value="{{ opp.source_url or '' }}">
        </div>
        <div class="col-md-4 d-flex align-items-center mt-md-4">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" name="is_verified" value="1" id="verifySwitch" {% if opp.is_verified == 1 %}checked{% endif %}>
            <label class="form-check-label fw-semibold small" for="verifySwitch">Mark as Manually Verified</label>
          </div>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label fw-bold small">How to Apply (Steps)</label>
        <textarea name="how_to_apply" class="form-control" rows="2">{{ opp.how_to_apply or '' }}</textarea>
      </div>

      <div class="d-flex justify-content-end gap-2">
        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary px-4">Cancel</a>
        <button type="submit" class="btn btn-primary-custom px-5 fw-bold">
          <i class="bi bi-save me-1"></i> Update Opportunity
        </button>
      </div>

    </form>
  </div>

</div>
{% endblock %}
